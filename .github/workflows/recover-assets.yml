name: Trocki22 - Eksik dosyalari topluca al

on:
  push:
    branches: [main]
    paths:
      - scripts/recover-assets.py
      - .github/workflows/recover-assets.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trocki22-asset-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6

      - name: Betik sozdizimini kontrol et
        run: python3 -m py_compile scripts/recover-assets.py

      - name: Mevcut siteden eksik dosyalari al ve dogrula
        run: python3 -u scripts/recover-assets.py

      - name: Tamamlanan dosyalari depoya kaydet
        shell: bash
        run: |
          set -euo pipefail
          git add -- assets
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Mevcut siteden eksik gorsel ve stil dosyalarini tamamla"
            git push origin HEAD:main
          fi

      - name: Aktarim raporunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trocki22-dosya-aktarim-raporu
          path: asset-recovery-report.json
          if-no-files-found: ignore
