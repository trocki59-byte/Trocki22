<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#541b3d"><title>TROÇKİ MAHJONG 3</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,sans-serif}body{color:#fff4cd;background:radial-gradient(circle at 75% 20%,#ee8fca 0,#8356b6 27%,#334b9c 53%,#174b55 85%);overflow-x:hidden}.scene{position:fixed;inset:0;pointer-events:none;overflow:hidden}.scene:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 76%,#f4a54b66,transparent 35%),linear-gradient(transparent 65%,#074d56bb)}.pagoda{position:absolute;right:-12px;top:18%;font-size:clamp(110px,24vw,260px);filter:drop-shadow(0 14px 10px #25154c99);opacity:.85}.lantern{position:absolute;left:1%;top:15%;font-size:clamp(55px,11vw,115px);filter:drop-shadow(0 0 15px #f7ad42)}.flower{position:absolute;color:#ff91c8;text-shadow:0 3px 6px #78285b;font-size:clamp(24px,5vw,55px)}.f1{left:3%;top:2%}.f2{left:14%;top:7%}.f3{right:5%;top:6%}.f4{right:15%;bottom:15%}.f5{left:5%;bottom:16%}main{position:relative;max-width:950px;margin:auto;padding:10px 10px 22px;min-height:100dvh}.head{display:flex;align-items:center;justify-content:center;gap:8px}.dragon{font-size:clamp(24px,6vw,58px);filter:drop-shadow(0 2px 4px #3b1633)}h1{margin:0;text-align:center;font-family:Georgia,serif;font-size:clamp(25px,6vw,58px);line-height:1.06;letter-spacing:1px;color:#ffe38c;text-shadow:0 2px #9e4c16,0 4px #6c1c26,0 7px 10px #201125}.subtitle{margin:2px auto 10px;text-align:center;font-weight:800;color:#ffe5b4;text-shadow:0 2px 5px #32112b}.stats{display:flex;justify-content:space-between;align-items:center;gap:7px;margin:5px auto 9px;max-width:750px}.pill{background:linear-gradient(130deg,#75253c,#3a1d45);border:2px solid #e9b54c;border-radius:40px;padding:7px 12px;box-shadow:0 4px 0 #55202b,0 5px 12px #171026a0;font-weight:800;font-size:clamp(12px,2.8vw,18px)}.board-shell{border:5px ridge #f7ca6a;border-radius:22px;background:linear-gradient(160deg,#d882a766,#165b64b8 42%,#0b5259bb);box-shadow:0 10px 25px #161c3b99,inset 0 0 40px #ffdc8055;position:relative;padding:9px 4px;margin:auto;max-width:800px}.board{position:relative;margin:auto;touch-action:manipulation}.tile{position:absolute;display:grid;place-items:center;padding:0;line-height:1;border:2px solid #fffaf0;border-right:6px solid #d8b375;border-bottom:9px solid #a76d31;border-radius:11px;background:linear-gradient(132deg,#fffdf4 0%,#fff6df 48%,#e8c99d 100%);color:#164a46;box-shadow:4px 7px 0 #5b432a,7px 11px 10px #102127b8;transition:transform .15s,filter .15s,opacity .15s;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.tile:active:not(:disabled){transform:translateY(-6px) scale(1.05)}.tile:disabled{filter:brightness(.62) saturate(.65);cursor:default}.tile.free{filter:drop-shadow(0 0 3px #ffedb6)}.tile.hint{outline:4px solid #fff85b;animation:blink .7s infinite alternate}@keyframes blink{to{filter:brightness(1.4);transform:translateY(-4px)}}.tray-frame{max-width:600px;margin:14px auto 6px;padding:7px;border:5px ridge #ffc45c;border-radius:17px;background:linear-gradient(#8d3d1d,#381e18);box-shadow:0 6px 15px #170e1b99}.tray{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.slot{aspect-ratio:1/1.1;border-radius:8px;background:linear-gradient(#391c19,#6b311e);border:2px solid #cf8e46;box-shadow:inset 0 5px 9px #130c0d;display:grid;place-items:center;color:#184b45}.slot.filled{background:linear-gradient(140deg,#fffdf1,#edcb91);border:2px solid #fff4d2;box-shadow:inset -4px -5px #d2a55b}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin:12px auto}.tools button,.action{background:linear-gradient(160deg,#168769,#075342);border:3px solid #f7c865;border-radius:15px;box-shadow:0 5px 0 #063a33,0 7px 12px #17172c99;color:#fff3d0;padding:9px 12px;font-weight:800;font-size:clamp(12px,2.7vw,16px);cursor:pointer}.tools button:disabled{opacity:.5}.message{min-height:25px;text-align:center;color:#fff4b3;font-weight:800;text-shadow:0 2px 4px #1d1d32}.help{text-align:center;font-size:12px;color:#ffebc8;max-width:620px;margin:12px auto;text-shadow:0 1px 3px #000}.overlay{position:fixed;inset:0;background:#170d28c9;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}.overlay.show{display:flex}.modal{background:linear-gradient(150deg,#742b64,#174c55);border:4px ridge #ffd37d;border-radius:22px;padding:24px;text-align:center;max-width:380px;box-shadow:0 15px 50px #000b}.modal h2{color:#ffe58f}footer{text-align:center;font-size:11px;color:#f2d6bf;margin-top:16px}@media(max-width:520px){.board-shell{padding:5px 0;border-width:3px}.stats{gap:4px}.pill{padding:6px 8px}.tools button{padding:9px 8px;border-width:2px}.tray-frame{margin-top:10px}.pagoda{right:-30px;opacity:.55}}
</style><style>.board-shell{background:radial-gradient(ellipse at 50% 25%,#b57d95aa,#195e67e8 60%,#143f4c),linear-gradient(130deg,#e8b5b3,#22556c)}.board-shell:before{content:"🌸 🌺 🌸";position:absolute;top:2px;left:0;right:0;text-align:center;font-size:26px;opacity:.65;pointer-events:none}.tile{background:linear-gradient(145deg,#fffef6 0%,#ffefd3 45%,#eac28b 100%);border-right:8px solid #cfa064;border-bottom:11px solid #966335;box-shadow:4px 6px 0 #65553a,8px 13px 12px #101b23b0}.tile.free{filter:drop-shadow(0 0 5px #fff0ad)}.scene .pagoda{opacity:.9}.tray-frame{box-shadow:0 9px 19px #120b27a6,inset 0 3px 5px #ffe09b}.tools button:hover{filter:brightness(1.2)}</style><style>
.tile{background:linear-gradient(145deg,#fffefb 0%,#fff6d6 48%,#ffe1a0 100%)!important;border:3px solid #fff9e9!important;border-right:8px solid #e3a853!important;border-bottom:11px solid #ac672c!important;box-shadow:4px 7px 0 #4b6470,8px 14px 13px #080e2cbb!important}
.tile span{width:83%;height:80%;display:grid!important;place-items:center;border-radius:9px;background:linear-gradient(140deg,#fff9e8,#ffe8b6);box-shadow:inset 0 0 0 2px #efcf91,0 2px 5px #79502744;font-size:1.08em!important;text-shadow:0 2px 2px #fff!important}
.tile:nth-child(6n+1) span{background:linear-gradient(145deg,#ffe4e9,#ffadc1);box-shadow:inset 0 0 0 3px #e75176,0 2px 4px #751f36}
.tile:nth-child(6n+2) span{background:linear-gradient(145deg,#d7fff4,#7de9b5);box-shadow:inset 0 0 0 3px #25a36d,0 2px 4px #16614a}
.tile:nth-child(6n+3) span{background:linear-gradient(145deg,#e6e0ff,#b8a2ff);box-shadow:inset 0 0 0 3px #8154d7,0 2px 4px #4b2782}
.tile:nth-child(6n+4) span{background:linear-gradient(145deg,#fff5c4,#ffd36d);box-shadow:inset 0 0 0 3px #e69a2e,0 2px 4px #85541c}
.tile:nth-child(6n+5) span{background:linear-gradient(145deg,#d6f8ff,#7bcfe9);box-shadow:inset 0 0 0 3px #3197c5,0 2px 4px #175479}
.tile:nth-child(6n) span{background:linear-gradient(145deg,#ffe2f7,#f6a0e6);box-shadow:inset 0 0 0 3px #c74cb6,0 2px 4px #74216c}
.tile:not(:disabled):active{transform:translateY(-8px) scale(1.07)!important;filter:brightness(1.2)!important}
.slot.filled{background:linear-gradient(135deg,#fff1bd,#ffc875)!important;border-color:#fff6d1!important}
</style></head><body><div class="scene"><div class="pagoda">🏯</div><div class="lantern">🏮</div><div class="flower f1">🌸</div><div class="flower f2">🌸</div><div class="flower f3">🌸</div><div class="flower f4">🌸</div><div class="flower f5">🌸</div></div><main><div class="head"><span class="dragon">🐉</span><h1>TROÇKİ<br>MAHJONG 3</h1><span class="dragon">🐲</span></div><p class="subtitle">✦ ÜÇLÜ EŞLEŞTİRME ✦</p><div class="stats"><span class="pill">⭐ Seviye <b id="level">1</b></span><span class="pill">🏆 <b id="score">0</b></span><span class="pill">👑 <b id="best">0</b></span></div><div class="board-shell"><div class="board" id="board"></div></div><div class="tray-frame"><div class="tray" id="tray"></div></div><div class="message" id="message" aria-live="polite"></div><div class="tools"><button id="undo">↶ Geri al</button><button id="hint">💡 İpucu</button><button id="shuffle">🔀 Karıştır</button><button id="restart">↻ Yeniden</button><button id="sound">🔊 Ses</button></div><p class="help">Üstü açık taşları seç. Aynı türden 3 taş tepside birleşince kaybolur. Tepsi 7 taşla dolarsa oyun biter. 50 seviye.</p><footer>© TROÇKİ STUDIO · Mahjong 3 · v3.2</footer></main><div class="overlay" id="overlay"><div class="modal"><h2 id="modalTitle"></h2><p id="modalBody"></p><button class="action" id="next">Devam et</button></div></div><script>
(()=>{'use strict';const $=x=>document.getElementById(x);const icons=['🐉','🌸','🎋','🏮','🪷','🪙','🏯','🐟','🀄','🀅','🀆','🀇','🀈','🀉','🀊','🀋','🀌','🀍','🀎','🀏','🀐','🀑','🀒','🀓'];let level=Number(localStorage.getItem('tm3v3level'))||1,score=Number(localStorage.getItem('tm3v3score'))||0,best=Number(localStorage.getItem('tm3v3best'))||0,tiles=[],tray=[],undo=[],muted=false,over=false,mode='',size=54,hintId=-1;const rnd=n=>Math.floor(Math.random()*n);function persist(){localStorage.setItem('tm3v3level',level);localStorage.setItem('tm3v3score',score);localStorage.setItem('tm3v3best',best)}function beep(f=500){if(muted)return;try{const ctx=new(window.AudioContext||window.webkitAudioContext)(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=f;gain.gain.setValueAtTime(.07,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.14);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.15);osc.onended=()=>ctx.close()}catch(e){}}function cover(a,b){return b.active&&b.z>a.z&&Math.abs(a.x-b.x)<.85&&Math.abs(a.y-b.y)<.85}function free(t){return !tiles.some(b=>cover(t,b))}function left(){return tiles.filter(t=>t.active)}function start(){over=false;tray=[];undo=[];hintId=-1;let groups=9+Math.min(7,Math.floor((level-1)/5));const syms=[...icons].sort(()=>Math.random()-.5).slice(0,groups);let vals=syms.flatMap(s=>[s,s,s]);const cols=6;const positions=[];const bottomCount=Math.ceil(vals.length*.67/3)*3;for(let i=0;i<bottomCount;i++)positions.push({x:i%cols,y:Math.floor(i/cols),z:0});const topCount=vals.length-bottomCount;for(let i=0;i<topCount;i++)positions.push({x:(i%5)+.46,y:Math.floor(i/5)+.45,z:1});const order=[...positions.keys()].sort((a,b)=>positions[b].z-positions[a].z);let pool=[...vals];tiles=positions.map((p,id)=>({...p,id,s:'',active:true}));for(const id of order){let idx=rnd(pool.length);tiles[id].s=pool.splice(idx,1)[0]}$('message').textContent='Üç aynı taşı eşleştir!';render()}function render(){const board=$('board');size=Math.max(38,Math.min(81,Math.floor((Math.min(window.innerWidth-34,770)-24)/6.6)));const cols=6;const rows=Math.ceil(tiles.filter(t=>t.z===0).length/cols);board.style.width=(size*6.55)+'px';board.style.height=(size*(rows+.95))+'px';board.replaceChildren();for(const t of [...tiles].sort((a,b)=>a.z-b.z)){if(!t.active)continue;const b=document.createElement('button');b.className='tile '+(free(t)?'free':'')+(hintId===t.id?' hint':'');b.style.left=(t.x*size+4)+'px';b.style.top=(t.y*size+3)+'px';b.style.width=(size-5)+'px';b.style.height=(size-5)+'px';b.style.zIndex=t.z+1;b.style.fontSize=Math.floor(size*.53)+'px';b.innerHTML='<span style="display:block;font-size:.9em;filter:drop-shadow(0 2px 1px #5e4028)">'+t.s+'</span>';b.disabled=over||!free(t);b.setAttribute('aria-label','Taş '+t.s);b.onclick=()=>pick(t.id);board.append(b)}$('tray').replaceChildren();for(let i=0;i<7;i++){const d=document.createElement('div');d.className='slot'+(tray[i]?' filled':'');d.textContent=tray[i]||'';d.style.fontSize=Math.floor(Math.min(size*.52,36))+'px';$('tray').append(d)}$('level').textContent=level+'/50';$('score').textContent=score;$('best').textContent=best;$('undo').disabled=!undo.length||over}function pick(id){const t=tiles.find(t=>t.id===id);if(!t||!t.active||!free(t)||over)return;undo.push({tiles:tiles.map(x=>({...x})),tray:[...tray],score});hintId=-1;t.active=false;tray.push(t.s);if(tray.filter(s=>s===t.s).length===3){tray=tray.filter(s=>s!==t.s);score+=30+level*3;beep(780);$('message').textContent='✨ Üçlü eşleşme! +'+(30+level*3)}else{score+=5;beep(460);$('message').textContent='Taş toplandı'}best=Math.max(best,score);persist();render();if(left().length===0&&tray.length===0){over=true;mode='win';modal('🏆 Bölüm tamamlandı!','Muhteşem! Yeni seviyeye geçebilirsin.')}else if(tray.length===7){over=true;mode='lose';modal('Tepsi doldu!','Yeniden deneyerek daha iyi bir strateji kur.')}else if(!left().some(free)){over=true;mode='lose';modal('Hamle kalmadı','Bölümü yeniden deneyebilirsin.')}}function modal(title,body){$('modalTitle').textContent=title;$('modalBody').textContent=body;$('next').textContent=mode==='win'?'Sonraki seviye':'Tekrar dene';$('overlay').classList.add('show')}$('next').onclick=()=>{$('overlay').classList.remove('show');if(mode==='win'){level=level===50?1:level+1;persist()}start()};$('undo').onclick=()=>{if(over||!undo.length)return;const h=undo.pop();tiles=h.tiles;tray=h.tray;score=h.score;hintId=-1;persist();render();$('message').textContent='Son hamle geri alındı'};$('hint').onclick=()=>{if(over)return;const available=left().filter(free);const count={};available.forEach(t=>count[t.s]=(count[t.s]||0)+1);const choice=available.find(t=>tray.includes(t.s))||available.find(t=>count[t.s]>=3)||available[0];hintId=choice?choice.id:-1;render();$('message').textContent=choice?'💡 Parlayan taşı seç':'Serbest taş yok'};$('shuffle').onclick=()=>{if(over)return;const remaining=left(),values=remaining.map(t=>t.s);for(let i=values.length-1;i>0;i--){const j=rnd(i+1);[values[i],values[j]]=[values[j],values[i]]}remaining.forEach((t,i)=>t.s=values[i]);hintId=-1;undo=[];render();$('message').textContent='🔀 Taşlar karıştırıldı'};$('restart').onclick=()=>{score=0;persist();start()};$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇 Sessiz':'🔊 Ses'};window.addEventListener('resize',render);start()})();
</script></body></html>
