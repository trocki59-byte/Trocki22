<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102a26"><title>TROÇKİ MAHJONG 3</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 10%,#fb8cbb66,transparent 35%),radial-gradient(circle at 85% 15%,#8b7bff88,transparent 40%),linear-gradient(160deg,#453b9b,#15596a 60%,#18392d);color:#fff3d9;font-family:system-ui,sans-serif;min-height:100dvh}main{max-width:850px;margin:auto;padding:14px}h1{text-align:center;margin:8px 0;color:#ffe49d;text-shadow:0 3px #702b30,0 6px 12px #000;font-size:clamp(25px,5vw,38px)}.sub{text-align:center;color:#c6d5bd;margin:0 0 14px}.stats,.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.stats span{padding:8px 12px;background:#133d37;border:1px solid #548b71;border-radius:10px}button{font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.tools button,.primary{border:1px solid #d7b878;background:linear-gradient(160deg,#2e9874,#0b4b43);box-shadow:0 4px 0 #123e33;color:#fff5d9;padding:10px 13px;border-radius:10px;font-weight:700}.tools{margin:13px 0}.board{position:relative;margin:14px auto;background:radial-gradient(circle at 50% 25%,#7abfa3,#176b6b 70%,#0a3c48);border:5px ridge #f5ca63;border-radius:16px;box-shadow:inset 0 0 30px #0009,0 15px 40px #0006;overflow:hidden;touch-action:manipulation}.tile{position:absolute;display:grid;place-items:center;background:linear-gradient(135deg,#fffef4 0%,#fff5d4 60%,#e8bd76 100%);color:#164d54;border:2px solid #fff8e5;border-right:7px solid #d6a85a;border-bottom:10px solid #a97134;border-radius:13px;box-shadow:4px 9px 0 #2b4c47,6px 13px 12px #000a;text-shadow:0 1px 1px #fff;font-size:clamp(27px,5vw,43px);user-select:none;transition:transform .13s,opacity .2s}.tile:not(:disabled):hover{transform:translateY(-7px) scale(1.04);filter:brightness(1.08)}.tile:disabled{filter:brightness(.66);cursor:default}.tile.top{box-shadow:2px 5px 8px #000a}.tray{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:540px;margin:8px auto}.slot{aspect-ratio:1;display:grid;place-items:center;background:linear-gradient(150deg,#522c20,#251b26);border:3px solid #edbb64;border-radius:9px;font-size:clamp(24px,5vw,38px)}.slot.filled{background:linear-gradient(140deg,#fff9e6,#f4d59d);color:#244638;border:3px solid #ffd474}.notice{text-align:center;min-height:2.5em;color:#ffe5a5;font-weight:600}.help{text-align:center;color:#b7cfc5;font-size:13px;line-height:1.5}.overlay{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.overlay.show{display:flex}.dialog{background:#123c34;border:2px solid #d6b36b;border-radius:20px;padding:25px;max-width:390px;text-align:center;box-shadow:0 20px 60px #000a}.dialog h2{color:#ffdf9c}a{color:#ffdfa0}footer{text-align:center;font-size:12px;color:#9eb7ad;padding:12px}
</style><style>.board:before{content:"🌸 🏮 🌸";position:absolute;left:0;right:0;top:0;text-align:center;font-size:26px;opacity:.55;pointer-events:none}.tile{transform:perspective(500px) rotateX(5deg);filter:drop-shadow(0 2px 1px #613a1d)}.tile.top{filter:drop-shadow(0 6px 4px #111b)}.stats span{background:linear-gradient(140deg,#642f57,#321c48);border:2px solid #e7b45e;box-shadow:0 4px 0 #1e192c}.notice{color:#ffebaa;text-shadow:0 2px 4px #000}.slot{box-shadow:inset 0 5px 12px #000a}.tile:disabled{opacity:.65;filter:brightness(.68) saturate(.75)}.tile:not(:disabled){outline:1px solid #ffebac}</style></head><body><main><h1>🐉 TROÇKİ MAHJONG 3</h1><p class="sub">Renkli Çin bahçesinde üç boyutlu taş eşleştirme</p><div class="stats"><span>Seviye: <b id="level">1</b>/50</span><span>Puan: <b id="score">0</b></span><span>Taş: <b id="left">0</b></span><span>Rekor: <b id="best">0</b></span></div><div class="tools"><button id="undo">↶ Geri al</button><button id="hint">💡 İpucu</button><button id="shuffle">🔀 Karıştır</button><button id="restart">↻ Yeniden</button><button id="sound">🔊 Ses</button></div><div id="board" class="board" aria-label="Mahjong oyun tahtası"></div><p class="notice" id="notice" aria-live="polite"></p><div class="tray" id="tray" aria-label="Yedi bölmeli toplama tepsisi"></div><p class="help">Serbest taşlara dokun. Aynı sembolden 3 taş tepside birleşince kaybolur. Tepsi 7 taşa dolarsa kaybedersin. Üstü örtülü taşlar seçilemez.</p><footer>© TROÇKİ STUDIO · Renkli 3D görünümlü HTML5 · v2.0</footer></main><div class="overlay" id="overlay"><div class="dialog"><h2 id="modalTitle"></h2><p id="modalText"></p><button class="primary" id="continue">Devam et</button></div></div><script>
(()=>{'use strict';const symbols=['🀄','🀅','🀆','🀇','🀈','🀉','🀊','🀋','🀌','🀍','🀎','🀏','🀐','🀑','🀒','🀓','🀔','🀕','🀖','🀗','🀘','🀙','🀚','🀛','🀜','🀝','🀞','🀟','🀠','🀡','🀢','🀣','🀤','🀥','🀦','🀧','🀨','🀩','🀪','🀫','🀬','🀭','🀮','🀯'];const $=id=>document.getElementById(id);let level=Math.min(50,Math.max(1,+localStorage.getItem('tm3level')||1)),score=+localStorage.getItem('tm3score')||0,best=+localStorage.getItem('tm3best')||0,tiles=[],tray=[],history=[],muted=false,ended=false,cell=52,boardW=0,boardH=0,mode='';const random=n=>Math.floor(Math.random()*n);function sound(freq=520){if(muted)return;try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.06,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.12);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.13);o.onended=()=>a.close()}catch(e){}}function save(){localStorage.setItem('tm3level',level);localStorage.setItem('tm3score',score);localStorage.setItem('tm3best',best)}function overlaps(a,b){return Math.abs(a.x-b.x)<.82&&Math.abs(a.y-b.y)<.82}function free(t){return !tiles.some(u=>u.active&&u.z>t.z&&overlaps(u,t))}function remaining(){return tiles.filter(t=>t.active)}function newGame(){ended=false;tray=[];history=[];const groups=8+Math.min(10,Math.floor((level-1)/3)),chosen=[...symbols].sort(()=>Math.random()-.5).slice(0,groups);let values=chosen.flatMap(s=>[s,s,s]);for(let i=values.length-1;i>0;i--){let j=random(i+1);[values[i],values[j]]=[values[j],values[i]]}let positions=[];const cols=6,rows=Math.ceil(values.length/cols);for(let i=0;i<values.length;i++){let z=i>=Math.ceil(values.length*.72)?1:0;positions.push({x:i%cols+(z?.24:0),y:Math.floor(i/cols)+(z?.2:0),z})}tiles=positions.map((p,i)=>({...p,id:i,s:values[i],active:true}));render();$('notice').textContent='Üç aynı taşı bir araya getir!'}function render(){const board=$('board'),w=Math.min(board.parentElement.clientWidth-28,660);cell=Math.floor(Math.min(82,(w-16)/6.6));boardW=cell*6.6;boardH=cell*(Math.ceil(tiles.length/6)+.9);board.style.width=boardW+'px';board.style.height=boardH+'px';board.replaceChildren();for(const t of [...tiles].sort((a,b)=>a.z-b.z)){if(!t.active)continue;const b=document.createElement('button');b.className='tile'+(t.z?' top':'');b.style.cssText='left:'+(t.x*cell+5)+'px;top:'+(t.y*cell+5)+'px;width:'+(cell-5)+'px;height:'+(cell-5)+'px;z-index:'+(t.z+1);b.textContent=t.s;b.disabled=!free(t)||ended;b.setAttribute('aria-label','Mahjong taşı '+t.s);b.onclick=()=>pick(t.id);board.append(b)}$('tray').replaceChildren();for(let i=0;i<7;i++){const d=document.createElement('div');d.className='slot'+(tray[i]?' filled':'');d.textContent=tray[i]||'';$('tray').append(d)}$('level').textContent=level;$('score').textContent=score;$('best').textContent=best;$('left').textContent=remaining().length;$('undo').disabled=!history.length||ended;$('hint').disabled=ended;$('shuffle').disabled=ended}function pick(id){const t=tiles.find(t=>t.id===id);if(!t||!t.active||!free(t)||ended)return;history.push({tiles:tiles.map(x=>({...x})),tray:[...tray],score});t.active=false;tray.push(t.s);const n=tray.filter(s=>s===t.s).length;if(n===3){tray=tray.filter(s=>s!==t.s);score+=30+level*2;sound(760)}else{score+=5;sound(440)}best=Math.max(best,score);save();render();if(!remaining().length&&tray.length===0){ended=true;mode='win';show('🏆 Bölüm tamamlandı!','Harika! '+level+'. seviyeyi bitirdin.')}else if(tray.length>=7){ended=true;mode='lose';show('Tepsi doldu!','Yedi bölme doldu. Bölümü yeniden deneyebilirsin.')}else if(!remaining().some(free)){ended=true;mode='lose';show('Hamle kalmadı','Bölümü yeniden başlat veya karıştırmayı daha erken kullan.')}}function show(title,msg){$('modalTitle').textContent=title;$('modalText').textContent=msg;$('continue').textContent=mode==='win'?'Sonraki seviye':'Tekrar dene';$('overlay').classList.add('show')}function close(){$('overlay').classList.remove('show')}$('continue').onclick=()=>{close();if(mode==='win'){if(level<50)level++;else{level=1;score+=500}}save();newGame()};$('undo').onclick=()=>{if(!history.length||ended)return;const h=history.pop();tiles=h.tiles;tray=h.tray;score=h.score;save();render();$('notice').textContent='Son hamle geri alındı.'};$('hint').onclick=()=>{const avail=remaining().filter(free);const counts={};for(const t of avail)counts[t.s]=(counts[t.s]||0)+1;const match=avail.find(t=>counts[t.s]>=3||tray.includes(t.s))||avail[0];$('notice').textContent=match?'İpucu: '+match.s+' sembollü serbest taşı seç.':'Uygun taş bulunamadı.'};$('shuffle').onclick=()=>{const active=remaining(),vals=active.map(t=>t.s);for(let i=vals.length-1;i>0;i--){const j=random(i+1);[vals[i],vals[j]]=[vals[j],vals[i]]}active.forEach((t,i)=>t.s=vals[i]);history=[];render();$('notice').textContent='Kalan taşlar karıştırıldı.'};$('restart').onclick=()=>{score=0;save();newGame()};$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇 Sessiz':'🔊 Ses'};window.addEventListener('resize',render);newGame()})();
</script></body></html>
